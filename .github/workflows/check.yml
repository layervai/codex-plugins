name: Check plugins

# Daily, on every PR, on main pushes, and by hand:
# - the qURL plugin's copy of the agent skill is the served skill, byte for
#   byte after the directory compliance patch (the served skill is the source);
# - the marketplace and plugin manifests parse and follow the format, and the
#   plugin version is a semantic version;
# - Codex itself installs the plugin from this checkout and loads its skills.
on:
  schedule:
    # 05:47 UTC: off-peak, offset from the top of the hour to dodge GitHub's
    # scheduled-load spikes.
    - cron: "47 5 * * *"
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Codex CLI the install check runs. Raise it on purpose, not by range.
  CODEX_VERSION: 0.162.1

jobs:
  bundled-skill:
    name: Bundled skill is the served skill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare plugins/qurl/skills/qurl/SKILL.md with the served file
        run: |
          set -euo pipefail
          bundled=plugins/qurl/skills/qurl/SKILL.md
          source_dir="$RUNNER_TEMP/qurl-skill-source"
          mkdir -p "$source_dir/references"
          served="$source_dir/SKILL.md"
          url=https://layerv.ai/skills/qurl/SKILL.md
          if ! curl -fsSL --proto '=https' --retry 5 --retry-all-errors --retry-delay 10 \
              --connect-timeout 15 --max-time 60 -o "$served" "$url"; then
            echo "::error::could not download $url after retries; nothing was compared. Run the workflow again." >&2
            exit 1
          fi
          reference=skills/qurl/references/access-policies.md
          curl -fsSL --proto '=https' --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 15 --max-time 60 \
            https://layerv.ai/skills/qurl/references/access-policies.md -o "$source_dir/references/access-policies.md"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/scripts/directory-skill.patch"
          cmp "$source_dir/references/access-policies.md" "plugins/qurl/$reference"
          if cmp -s "$served" "$bundled"; then
            echo "ok: $bundled matches the patched served skill ($(sha256sum < "$bundled" | cut -c1-12))"
            exit 0
          fi
          diff -u "$bundled" "$served" | head -n 80 || true
          echo "::error file=$bundled::$bundled is not the served skill. Follow the plugin README to update both source files and apply the directory patch, then raise the plugin version." >&2
          exit 1

  manifests:
    name: Manifests and Codex install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the marketplace and plugin manifests
        run: |
          python3 -I scripts/check_manifests.py .
          python3 -I -m unittest discover -s scripts -p 'test_*.py'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      # Codex has no validate command and skips a marketplace entry it cannot
      # resolve, so the script checks what Codex installed and loaded, not
      # just that each command exited 0.
      - name: Install the plugins with Codex ${{ env.CODEX_VERSION }} and check its skills
        timeout-minutes: 8
        run: python3 -I scripts/check_codex_install.py . -- npx -y "@openai/codex@${CODEX_VERSION}"
